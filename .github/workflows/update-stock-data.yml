name: Update Stock Data Daily

on:
  schedule:
    # Runs at 6:30 AM IST (1:00 AM UTC) every day - after market closes
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install yfinance pandas
          
      - name: Update stock data
        run: |
          cd backend/ml_training
          python download_popular_stocks.py
          
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/ml_training/data/
          git diff --staged --quiet || git commit -m "📊 Auto-update stock data $(date +'%Y-%m-%d')"
          git push
